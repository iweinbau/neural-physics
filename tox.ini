# flake8 configuration (flake8 does not read pyproject.toml).
# The CI gate is `pdm run lint`, which passes these rules on the command line as well, so a lost or
# unstaged config file cannot change the outcome of a build. This file is only for editors and for a
# bare `flake8 .` on the command line.
[flake8]
max-line-length = 127
exclude = .git,__pycache__,build,dist,runs,site,review,node_modules,.venv,.pdm-build
# E9/F63/F7/F82 (syntax errors, undefined names) are the ones that fail the build
select = E9,F63,F7,F82
