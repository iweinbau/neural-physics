# Synthetic flag-on-a-pole cloth (generate the data first: bin/datagen_cloth -o bin/cloth.npz)
name: Cloth on a pole (synthetic)
output_dir: runs/cloth
data:
  dataset: bin/cloth.npz
  test_fraction: 0.25          # 2 of the 8 wind episodes are held out
  split_seed: 0
pca:
  n_components: 64
  external_components: null    # wind velocity is used raw (3 dims)
  max_frames: 10000
model:
  n_layers: 10                 # paper: 10 linear layers, hidden width 1.5 x bases
  hidden_multiplier: 1.5
  linear_skip: true
train:
  epochs: 100
  batch_size: 16
  window_size: 32
  lr: 0.0001
  lr_decay: 0.999
  noise_std: 0.01              # relative to each PCA component's std (paper: 0.01 absolute in its own units)
  noise_mode: relative
  eval_windows: 128
  eval_horizon: 32
  tensorboard: false
runtime:
  eval_frames: 1500
  clip: true
  viewer: viewer.html
  title: Cloth on a pole — Subspace Neural Physics
  units: m
  external_label: wind (m/s)
