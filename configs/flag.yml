# Real flag data exported from your simulator (Maya nCloth, Blender, ...).
# Legacy layout written by earlier versions of this repo: two .npy files with one row per frame.
name: Flag
output_dir: runs/flag
data:
  data_file: bin/flag_simulation.npy   # (frames x 3c) or (frames, c, 3) vertex positions
  external_file: bin/flag_wind.npy     # (frames x e) external state, e.g. wind velocity / speed + direction
  # faces_file: bin/flag.obj           # optional: mesh faces (.obj or .npy) so the viewer can shade the cloth
  dt: 0.016666666666666666             # frame time of the export (60 fps)
  test_fraction: 0.2                   # last 20% of the sequence is held out (or whole episodes if segments exist)
pca:
  n_components: 64                     # paper: 64 / 128 / 256 -- check the reported reconstruction error
  external_components: null            # null: raw external state; the paper applies PCA with v = e (a rotation)
  max_frames: 10000
model:
  n_layers: 10
  hidden_multiplier: 1.5
  linear_skip: true
train:
  epochs: 100
  batch_size: 16
  window_size: 32
  lr: 0.0001
  lr_decay: 0.999
  noise_std: 0.01
  noise_mode: relative
  eval_windows: 128
  eval_horizon: 32
runtime:
  eval_frames: 2000
  clip: true
  viewer: viewer.html
  title: Flag — Subspace Neural Physics
  units: ""
  external_label: wind
