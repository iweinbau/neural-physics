# Install with PDM, lint and run the tests on every push / PR to main.

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up PDM with Python ${{ matrix.python-version }}
      uses: pdm-project/setup-pdm@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: true
    - name: Install dependencies (locked)
      run: pdm install -G dev
    - name: Lint with flake8
      run: |
        # stop the build on Python syntax errors or undefined names (rules in .flake8)
        pdm run lint
        # advisory style report (never fails the build)
        pdm run flake8 . --count --exit-zero --select=E,W,F,C --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: pdm run test
    - name: Build wheel
      run: pdm build
